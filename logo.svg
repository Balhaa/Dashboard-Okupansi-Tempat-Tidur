<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradien Background Shield -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Latar Perisai Medis RS (Medical Shield) -->
  <path d="M100 15 L165 40 C165 115 135 160 100 185 C65 160 35 115 35 40 Z" 
        fill="url(#bgGrad)" 
        stroke="#60a5fa" 
        stroke-width="4" 
        filter="url(#glow)"/>

  <!-- Gedung RS & Menara Utama -->
  <path d="M60 145 V85 A5 5 0 0 1 65 80 H135 A5 5 0 0 1 140 85 V145 Z" 
        fill="#ffffff" 
        fill-opacity="0.15"/>

  <!-- Palang Medis Merah / Putih (Emergency Hospital Cross) -->
  <g transform="translate(100, 85)">
    <!-- Shadow Palang -->
    <path d="M-12 -35 H12 V-12 H35 V12 H12 V35 H-12 V12 H-35 V-12 H-12 Z" 
          fill="#0f172a" 
          fill-opacity="0.25" 
          transform="translate(2, 3)"/>
    <!-- Palang Utama -->
    <path d="M-12 -35 H12 V-12 H35 V12 H12 V35 H-12 V12 H-35 V-12 H-12 Z" 
          fill="#ef4444" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round"/>
  </g>

  <!-- Garis Denyut Nadi / Heartbeat (ECG Pulse Line) -->
  <path d="M40 135 H75 L85 115 L95 150 L105 125 L115 140 L125 135 H160" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Titik Aksen Medis -->
  <circle cx="150" cy="55" r="4" fill="#38bdf8"/>
  <circle cx="50" cy="55" r="3" fill="#60a5fa"/>
</svg>
